[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-db-agent-sdk"
version = "1.0.0"
description = "Build and execute AI agent workflows in Oracle Database"
authors = [{ name = "Oracle" }]
keywords = ["Oracle", "database", "AI agents", "workflows", "PL/SQL", "SDK"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
license = "UPL-1.0"
license-files = ["LICENSE.txt", "NOTICE.txt", "THIRD_PARTY_LICENSE.txt"]
requires-python = ">=3.10,<3.15"
dependencies = [
    "oracledb==26.0.1",
    "pyagentspec>=26.2,<27",
]

[project.urls]
Repository = "https://github.com/oracle/oracle-db-agent-sdk"
Documentation = "https://docs.oracle.com/en/database/oracle/oracle-database/26/odbae/oracle-database-agent-sdk/quickstart-build-an-ai-agent-with-python.html"
"API Reference" = "https://docs.oracle.com/en/database/oracle/oracle-database/26/odbae/oracle-database-agent-sdk/python-api-reference.html"

[project.optional-dependencies]
dev = [
    "bandit>=1.7,<2",
    "build>=1,<2",
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
    "tomli>=2,<3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["oracle_db_agent_sdk*"]
namespaces = false

[tool.setuptools.package-data]
oracle_db_agent_sdk = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["oracle_db_agent_sdk"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["oracle_db_agent_sdk"]

[tool.coverage.report]
fail_under = 95
show_missing = true
